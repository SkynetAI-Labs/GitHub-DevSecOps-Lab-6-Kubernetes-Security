apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lab-client
  namespace: lab6-security
spec:
  podSelector:
    matchLabels:
      app: lab6-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lab6-client
      ports:
        - protocol: TCP
          port: 8080
