apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab6-auditor
  namespace: lab6-security
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-auditor
  namespace: lab6-security
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-auditor
  namespace: lab6-security
subjects:
  - kind: ServiceAccount
    name: lab6-auditor
    namespace: lab6-security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-auditor
