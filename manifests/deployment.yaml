apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab6-web
  namespace: lab6-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab6-web
  template:
    metadata:
      labels:
        app: lab6-web
    spec:
      serviceAccountName: lab6-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx/nginx-unprivileged@sha256:517607ae849a46afbd400616a783e4ead0290f52d20ccc0618ccea1a49362474
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
