apiVersion: v1
kind: Pod
metadata:
  name: lab6-secret-check
  namespace: lab6-security
spec:
  serviceAccountName: lab6-web
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: nginx/nginx-unprivileged@sha256:517607ae849a46afbd400616a783e4ead0290f52d20ccc0618ccea1a49362474
      command:
        - sh
        - -c
        - 'test -s /run/lab-secret/demo-token && echo "PASS: secret file is readable and nonempty"'
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 25m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      volumeMounts:
        - name: demo-secret
          mountPath: /run/lab-secret
          readOnly: true
  volumes:
    - name: demo-secret
      secret:
        secretName: lab6-demo-secret
        defaultMode: 0440
