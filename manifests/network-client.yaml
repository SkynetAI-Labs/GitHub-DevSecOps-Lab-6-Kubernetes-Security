apiVersion: v1
kind: Pod
metadata:
  name: lab6-client
  namespace: lab6-security
  labels:
    app: lab6-client
spec:
  serviceAccountName: lab6-web
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: client
      image: nginx/nginx-unprivileged@sha256:517607ae849a46afbd400616a783e4ead0290f52d20ccc0618ccea1a49362474
      command: ["sh", "-c", "sleep 14400"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 25m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
